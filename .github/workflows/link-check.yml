name: Link check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 9 * * 1'  # weekly Monday 09:00 UTC — catches external link rot

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1w
            --no-progress
            --exclude-path node_modules
            --exclude-path src/node_modules
            --exclude-path src/packages/web/node_modules
            './**/*.md'
          fail: true
