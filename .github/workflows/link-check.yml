name: Link check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - .github/workflows/link-check.yml
  schedule:
    - cron: '0 9 * * 1'  # weekly Monday 09:00 UTC — catches external link rot

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Get changed markdown files (PR only)
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v46
        with:
          files: '**/*.md'

      - name: Run lychee (PR — changed .md files only)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1w
            --no-progress
            --accept '200..=204,403'
            --exclude-path node_modules
            --exclude-path src/node_modules
            --exclude-path src/packages/web/node_modules
            ${{ steps.changed-files.outputs.all_changed_files }}
          fail: true

      - name: Run lychee (full scan — push / schedule / dispatch)
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1w
            --no-progress
            --accept '200..=204,403'
            --exclude-path node_modules
            --exclude-path src/node_modules
            --exclude-path src/packages/web/node_modules
            './**/*.md'
          fail: true
