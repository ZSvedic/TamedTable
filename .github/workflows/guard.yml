name: Design-token guard

# Fails a PR if any shipping component hard-codes a color instead of reading a
# ui-kit token (spec/packages/ui-kit/behavior.md § Tokens). Keeps the design
# system the single source of truth so the design base can't silently drift.
# Pure file scan — no install needed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun test tests/no-hardcoded-colors.test.ts
        working-directory: src
