name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      # Only rebuild when something that affects the web bundle changes.
      # Doc-only / ops-only commits should not redeploy.
      - 'src/packages/web/**'
      - 'src/packages/core/**'
      - 'src/packages/headless/**'
      - 'src/package.json'
      - 'src/bun.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # manual rebuild from the Actions tab
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: src
      - run: bun run build
        working-directory: src/packages/web
      - uses: actions/upload-pages-artifact@v3
        with: { path: src/packages/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
