name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      # Rebuild when the web bundle, the marketing homepage, or its shared
      # assets change. Doc-only / process-only commits should not redeploy.
      - 'src/packages/web/**'
      - 'src/packages/core/**'
      - 'src/packages/headless/**'
      - 'src/packages/model-config/**'
      - 'src/packages/gherkin-tour/**'
      - 'src/package.json'
      - 'src/bun.lock'
      - 'marketing/web/**'
      - 'marketing/illustrations/**'
      - 'marketing/brand/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # manual rebuild from the Actions tab
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: src
      - run: bun run build
        working-directory: src/packages/web
      # Assemble the Pages artifact: the marketing homepage at the root, the web
      # app under /app/, and the standalone module demos under /demos/.
      #   _site/            ← marketing/web/ (index.html + favicon + illustrations; symlinks dereferenced)
      #   _site/app/        ← web app build (vite base /TamedTable/app/)
      #   _site/demos/<n>/  ← per-package demo bundles
      - name: Assemble site root and app
        run: |
          set -euo pipefail
          mkdir -p _site/app
          cp -rL marketing/web/. _site/
          cp -r src/packages/web/dist/. _site/app/
      - name: Bundle module demos
        working-directory: src
        run: |
          set -euo pipefail
          for name in chat-panel file-io gherkin-tour model-config table-view toolbar ui-kit voice-input; do
            bun build "packages/$name/demo.html" \
              --outdir "../_site/demos/$name" \
              --public-path="/TamedTable/demos/$name/"
          done
      # Smoke-test the demo bundles in headless Chromium before deploying.
      - run: bunx playwright install chromium
        working-directory: src
      - run: bun run test:smoke
        working-directory: src
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
