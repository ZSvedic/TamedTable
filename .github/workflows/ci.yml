name: CI
# Runs the real test suite on every PR so reviewers (and autonomous agents on a
# claude/* branch) get a pass/fail gate. workflow_dispatch lets an agent
# re-trigger the run via the GitHub API after pushing a fix.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The save-py exported-script scenario executes the generated Python via
      # `uv run --script`. The script's PEP 723 header declares no dependencies,
      # so the run needs no network beyond uv itself being present.
      - uses: astral-sh/setup-uv@v6
      # Cache the bun install store and the Playwright browser download — both
      # keyed on bun.lock, so a run only pays the install/download cost when
      # dependencies change. The Chromium download is the slowest CI step.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('src/bun.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: bun install
        working-directory: src
      - run: bun run typecheck
        working-directory: src
      # The @web cucumber profile and the demo smoke test drive headless
      # Chromium; `bun install` alone does not fetch the browser binary.
      # `--with-deps` is skipped — a cache hit makes the install a no-op.
      - run: bunx playwright install chromium
        working-directory: src
      # Offline + key-free: cucumber.js defaults TAMEDTABLE_CASSETTE=replay, so
      # every model call is served from a recorded cassette. No secrets needed.
      - run: bun run test
        working-directory: src
      - run: bun run test:smoke
        working-directory: src
      # The e2e layer uses the web package's own @playwright/test pin, whose
      # bundled browser revision can differ from the root `playwright` installed
      # above — install from the web package so the revision matches its runner.
      - run: bunx playwright install chromium
        working-directory: src/packages/web
      # Browser-driven e2e against the PRODUCTION build. CI=true makes
      # playwright.config.ts `bun run build && bun run preview` instead of the
      # dev server, so the run tree-shakes and minifies exactly like the
      # deployed app — the class of bug that shipped in #259. Real clicks and a
      # real bundle catch what the DOM-less @web Cucumber profile cannot. The
      # green `chromium` project gates PRs; the bug-inventory `red` project does
      # not run here (`bun run test:e2e:red` runs it on demand).
      - run: bun run test:e2e
        working-directory: src/packages/web
