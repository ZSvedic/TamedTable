<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- TamedTable feature illustration: Understand first, "How many customers are there?",
       a question answered in a sentence plus the result table it came from; the table stays as it is -->
  <rect x="2" y="2" width="356" height="226" rx="16" fill="#FFFFFF" stroke="#DCDCDC"/>
  <rect x="18" y="18" width="324" height="36" rx="18" fill="#EFEBF7" stroke="#D8D0EC"/>
  <circle cx="40" cy="36" r="7" fill="#96BED7"/>
  <path d="M37.5 32.5 L43.5 36 L37.5 39.5 Z" fill="#281C60"/>
  <text x="56" y="41" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#281C60">How many customers are there?</text>
  <!-- the answer: an accent dot and one sentence -->
  <circle cx="25" cy="77" r="3.5" fill="#96BED7"/>
  <text x="36" y="81" font-size="13" fill="#281C60">6 customers, across 24 rows.</text>
  <!-- the result table the answer was computed from -->
  <g>
    <clipPath id="card"><rect x="18" y="100" width="324" height="50" rx="6"/></clipPath>
    <path d="M18 106 q0 -6 6 -6 h312 q6 0 6 6 v24 h-324 Z" fill="#281C60"/>
    <text x="32" y="119" font-size="12" font-weight="600" fill="#96BED7">customers</text>
    <text x="200" y="119" font-size="12" font-weight="600" fill="#FFFFFF">rows</text>
    <g clip-path="url(#card)">
      <rect x="18" y="124" width="324" height="26" fill="#E7F1F8"/>
      <rect x="18" y="124" width="4" height="26" fill="#96BED7"/>
    </g>
    <g font-size="12" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">
      <text x="32" y="141" font-weight="700">6</text>
      <text x="200" y="141">24</text>
    </g>
    <rect x="18" y="100" width="324" height="50" rx="6" fill="none" stroke="#DCDCDC"/>
  </g>
  <text x="18" y="182" font-size="11" fill="#6A6280">No step added, nothing to undo.</text>
  <text x="18" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#6A6280">SELECT count(DISTINCT Customer), count(*) FROM t</text>
</svg>
