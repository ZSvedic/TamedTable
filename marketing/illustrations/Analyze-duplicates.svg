<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- TamedTable feature illustration: Analyze, "Are there any duplicate rows?",
       a yes/no answered with the rows that repeat; removing them is the next request's step -->
  <rect x="2" y="2" width="356" height="226" rx="16" fill="#FFFFFF" stroke="#DCDCDC"/>
  <rect x="18" y="18" width="324" height="36" rx="18" fill="#EFEBF7" stroke="#D8D0EC"/>
  <circle cx="40" cy="36" r="7" fill="#96BED7"/>
  <path d="M37.5 32.5 L43.5 36 L37.5 39.5 Z" fill="#281C60"/>
  <text x="56" y="41" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#281C60">Are there any duplicate rows?</text>
  <circle cx="25" cy="77" r="3.5" fill="#96BED7"/>
  <text x="36" y="81" font-size="13" fill="#281C60">Yes: 2 rows appear twice.</text>
  <g>
    <clipPath id="card"><rect x="18" y="100" width="324" height="82" rx="6"/></clipPath>
    <path d="M18 106 q0 -6 6 -6 h312 q6 0 6 6 v24 h-324 Z" fill="#281C60"/>
    <text x="32" y="119" font-size="12" font-weight="600" fill="#FFFFFF">Customer</text>
    <text x="164" y="119" font-size="12" font-weight="600" fill="#FFFFFF">Quarter</text>
    <text x="228" y="119" font-size="12" font-weight="600" fill="#FFFFFF">Revenue</text>
    <text x="300" y="119" font-size="12" font-weight="600" fill="#96BED7">times</text>
    <g clip-path="url(#card)">
      <rect x="18" y="130" width="324" height="52" fill="#E7F1F8"/>
      <rect x="18" y="130" width="4" height="52" fill="#96BED7"/>
      <rect x="22" y="156" width="320" height="1" fill="#FFFFFF"/>
    </g>
    <g font-size="12" fill="#281C60">
      <text x="32" y="147">Alpen Kaffee</text>
      <text x="164" y="147" font-family="JetBrains Mono, ui-monospace, monospace">Q2</text>
      <text x="228" y="147" font-family="JetBrains Mono, ui-monospace, monospace">15500</text>
      <text x="300" y="147" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700">2</text>
      <text x="32" y="173">Acme Robotics</text>
      <text x="164" y="173" font-family="JetBrains Mono, ui-monospace, monospace">Q3</text>
      <text x="228" y="173" font-family="JetBrains Mono, ui-monospace, monospace">33500</text>
      <text x="300" y="173" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700">2</text>
    </g>
    <rect x="18" y="100" width="324" height="82" rx="6" fill="none" stroke="#DCDCDC"/>
  </g>
  <text x="18" y="202" font-size="11" fill="#6A6280">Next: "remove the duplicate rows" becomes a step.</text>
  <text x="18" y="220" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#6A6280">GROUP BY Customer, Quarter, Revenue HAVING count(*) &gt; 1</text>
</svg>
