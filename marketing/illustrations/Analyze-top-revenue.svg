<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- TamedTable feature illustration: Understand first, "Which customer brings in the most revenue?",
       a text column summed as numbers by SQL, answered in a sentence with the ranked result table -->
  <rect x="2" y="2" width="356" height="226" rx="16" fill="#FFFFFF" stroke="#DCDCDC"/>
  <rect x="18" y="18" width="324" height="36" rx="18" fill="#EFEBF7" stroke="#D8D0EC"/>
  <circle cx="40" cy="36" r="7" fill="#96BED7"/>
  <path d="M37.5 32.5 L43.5 36 L37.5 39.5 Z" fill="#281C60"/>
  <text x="56" y="40" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#281C60" textLength="278" lengthAdjust="spacingAndGlyphs">Which customer brings in the most revenue?</text>
  <circle cx="25" cy="77" r="3.5" fill="#96BED7"/>
  <text x="36" y="81" font-size="13" fill="#281C60">Acme Robotics: 162,000 in total revenue.</text>
  <g>
    <clipPath id="card"><rect x="18" y="100" width="324" height="102" rx="6"/></clipPath>
    <path d="M18 106 q0 -6 6 -6 h312 q6 0 6 6 v24 h-324 Z" fill="#281C60"/>
    <text x="32" y="119" font-size="12" font-weight="600" fill="#FFFFFF">Customer</text>
    <text x="232" y="119" font-size="12" font-weight="600" fill="#96BED7">revenue</text>
    <g clip-path="url(#card)">
      <rect x="18" y="124" width="324" height="26" fill="#E7F1F8"/>
      <rect x="18" y="124" width="4" height="26" fill="#96BED7"/>
    </g>
    <g font-size="12" fill="#281C60">
      <text x="32" y="141" font-weight="600">Acme Robotics</text>
      <text x="232" y="141" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700">162,000</text>
      <text x="32" y="167">Thames Analytics</text>
      <text x="232" y="167" font-family="JetBrains Mono, ui-monospace, monospace">92,100</text>
      <text x="32" y="193">Alpen Kaffee</text>
      <text x="232" y="193" font-family="JetBrains Mono, ui-monospace, monospace">75,300</text>
    </g>
    <rect x="18" y="100" width="324" height="102" rx="6" fill="none" stroke="#DCDCDC"/>
  </g>
  <text x="18" y="220" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#6A6280">sum(TRY_CAST(Revenue AS DOUBLE)) … ORDER BY 2 DESC</text>
</svg>
