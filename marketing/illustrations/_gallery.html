<!doctype html>
<meta charset="utf-8">
<title>TamedTable feature illustrations</title>
<style>
  body{background:#F6F2EB;margin:0;padding:24px;font-family:Inter,system-ui,sans-serif}
  h1{color:#281C60;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(2,360px);gap:20px}
  figure{margin:0}
  figcaption{color:#6A6280;font-size:12px;margin-top:4px}
  img{display:block;border-radius:16px}
</style>
<h1>TamedTable — feature illustrations</h1>
<div class="grid" id="g"></div>
<script>
  const files=[
    ["01-clean-fields.svg","Clean messy fields"],
    ["02-drop-duplicates.svg","Drop duplicates"],
    ["03-filter-rows.svg","Keep the rows you want"],
    ["04-sort-top.svg","Sort / top few"],
    ["05-group-totals.svg","Total by group"],
    ["06-split-column.svg","Split one column"],
    ["07-join-tables.svg","Combine two tables"],
    ["08-pivot-wide.svg","Pivot tall to wide"],
    ["09-flag-rows.svg","Flag bad rows"],
    ["10-sql-exact.svg","Be exact with SQL"],
  ];
  const g=document.getElementById("g");
  for(const [f,c] of files){
    g.insertAdjacentHTML("beforeend",
      `<figure><img src="${f}" width="360" height="230"><figcaption>${f} — ${c}</figcaption></figure>`);
  }
</script>
