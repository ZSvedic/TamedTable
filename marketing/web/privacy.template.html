<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Canonical-URL normaliser: drop /index.html and .html from the address bar so
     the visible URL matches the canonical (GitHub Pages has no server redirects).
     Plain HTML, no build step, so this partial is duplicated in each page's head. -->
<script>
(function(){var p=location.pathname;
if(p.endsWith('/index.html'))p=p.slice(0,-10);
else if(p.endsWith('.html'))p=p.slice(0,-5);
if(p!==location.pathname)history.replaceState(null,'',p+location.search+location.hash);})();
</script>
<link rel="canonical" href="https://www.tamedtable.com/privacy">
<title>Privacy | TamedTable</title>
<meta name="description" content="TamedTable's privacy policy: no server, no cookies. The third-party servers involved (GitHub Pages hosting, cookie-less Umami analytics, and your chosen LLM provider), each with its own policy.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<!--
  #Analytics privacy policy page. GENERATED: the body between the <main> tags is
  rendered from spec/legal/privacy.md by .github/scripts/render-md.ts during
  build-site.sh. Edit the policy there, not here; this file is only the page
  chrome (head, nav, footer, style). Same stack and theme as FAQ.html.
-->

  /* Reset the global section padding (76px) or the gaps balloon. */

  .guide h2 { font-size: 22px; font-weight: 600; color: var(--ink); }
  .guide p { color: var(--ink); margin-top: 14px; }
  .guide ul { margin-top: 12px; padding-left: 20px; }
  .guide li { color: var(--ink); margin-top: 6px; }
  .guide a { color: var(--accent); }
</style>
</head>
