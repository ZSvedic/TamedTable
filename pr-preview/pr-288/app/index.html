<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page scale is locked: browser pinch zoom would shrink the phone
         layout's fixed chrome (app bar, dock) along with the table, so the
         mobile shell zooms the table itself instead (useTableZoom). Android
         honors this lock; iOS ignores it and is handled by the same hook via
         gesture events. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TamedTable</title>
    <meta name="theme-color" content="#281C60" />
    <!-- Added to the home screen, the app runs full-screen — no browser bars.
         In a normal tab, the phone layout lets the page itself scroll the
         table, so a swipe hides the bars (see MobileShell). The manifest makes
         Android's install open standalone; Settings offers the prompt. -->
    <link rel="manifest" href="/pr-preview/pr-288/app/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TamedTable" />
    <!-- White-on-dark favicons so the app tab is distinct from the marketing
         homepage tab (dark-on-white). See marketing/brand/brand.md § Favicons. -->
    <link rel="icon" type="image/svg+xml" href="/pr-preview/pr-288/app/icon-square-ink-crisp.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pr-preview/pr-288/app/favicon-ink-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pr-preview/pr-288/app/favicon-ink-16.png" />
    <link rel="apple-touch-icon" sizes="48x48" href="/pr-preview/pr-288/app/favicon-ink-48.png" />
    <!-- Brand fonts: Outfit for the wordmark, Inter for UI, JetBrains Mono
         for data. Self-hosted from public/fonts/ so no request leaves for a
         third party (the FAQ's privacy promise covers fonts too). -->
    <link rel="stylesheet" href="/pr-preview/pr-288/app/fonts/fonts.css" />
    <script type="module" crossorigin src="/pr-preview/pr-288/app/assets/index-CrMXEUM8.js"></script>
    <link rel="stylesheet" crossorigin href="/pr-preview/pr-288/app/assets/index-Bptf7r91.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- The reused engine and its CSV libraries are authored for Node and
         expect two globals the browser lacks. Both are installed here, before
         main.tsx runs. `process` is a small stub — the engine only reads a few
         env vars at init. `Buffer` must be the real implementation, because
         csv-parse builds buffers the moment it loads; it comes from the
         `buffer` polyfill package. -->
    <script>
      window.process = { env: {}, cwd: function () { return '/'; }, platform: 'browser' };
    </script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "6c98efef9e034b45840e0518efb24a6d"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
