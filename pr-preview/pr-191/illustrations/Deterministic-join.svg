<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- TamedTable feature illustration: Combine two tables — "add each order's customer name" -->
  <rect x="2" y="2" width="356" height="226" rx="16" fill="#FFFFFF" stroke="#DCDCDC"/>
  <rect x="18" y="18" width="324" height="36" rx="18" fill="#EFEBF7" stroke="#D8D0EC"/>
  <circle cx="40" cy="36" r="7" fill="#96BED7"/>
  <path d="M37.5 32.5 L43.5 36 L37.5 39.5 Z" fill="#281C60"/>
  <text x="56" y="41" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12.5" fill="#281C60">add each order's customer name</text>
  <!-- left small table: orders -->
  <g font-size="11">
    <text x="18" y="80" font-size="10.5" fill="#6A6280">orders</text>
    <rect x="18" y="86" width="120" height="24" fill="#281C60"/>
    <text x="26" y="102" font-size="10.5" font-weight="600" fill="#FFFFFF">order</text>
    <text x="86" y="102" font-size="10.5" font-weight="600" fill="#96BED7">cust_id</text>
    <rect x="18" y="110" width="120" height="22" fill="#FFFFFF"/>
    <text x="26" y="125" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">#1041</text>
    <text x="90" y="125" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">c-7</text>
    <rect x="18" y="132" width="120" height="22" fill="#F6F2EB"/>
    <text x="26" y="147" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">#1042</text>
    <text x="90" y="147" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">c-3</text>
    <rect x="18" y="86" width="120" height="68" fill="none" stroke="#DCDCDC"/>
  </g>
  <!-- join connector: two keys converge at a node, then fan out to the matched table -->
  <g stroke="#96BED7" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M138 121 C 149 121, 152 132, 157 132"/>
    <path d="M138 143 C 149 143, 152 132, 157 132"/>
    <path d="M157 132 C 162 132, 165 121, 176 121"/>
    <path d="M157 132 C 162 132, 165 143, 176 143"/>
  </g>
  <circle cx="157" cy="132" r="4.5" fill="#96BED7" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- right table: customers, name column joined in -->
  <g font-size="11">
    <text x="176" y="80" font-size="10.5" fill="#6A6280">customers → joined</text>
    <rect x="176" y="86" width="166" height="24" fill="#281C60"/>
    <text x="184" y="102" font-size="10.5" font-weight="600" fill="#FFFFFF">cust_id</text>
    <text x="252" y="102" font-size="10.5" font-weight="600" fill="#96BED7">customer</text>
    <rect x="176" y="110" width="166" height="22" fill="#FFFFFF"/>
    <rect x="244" y="110" width="98" height="22" fill="#E7F1F8"/>
    <text x="184" y="125" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">c-7</text>
    <text x="252" y="125" fill="#281C60">Mara K.</text>
    <rect x="176" y="132" width="166" height="22" fill="#F6F2EB"/>
    <rect x="244" y="132" width="98" height="22" fill="#E7F1F8"/>
    <text x="184" y="147" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">c-3</text>
    <text x="252" y="147" fill="#281C60">Dev P.</text>
    <rect x="244" y="86" width="98" height="68" fill="none" stroke="#96BED7"/>
    <rect x="176" y="86" width="166" height="68" fill="none" stroke="#DCDCDC"/>
  </g>
  <text x="18" y="186" font-size="11" fill="#6A6280">matched on </text>
  <text x="86" y="186" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">cust_id</text>
</svg>
