<!doctype html>
<!-- #MobileShell — throwaway test bench for hiding the phone browser's bars.
     Self-contained (no imports, no framework) so it can be iterated fast and
     tested on a real phone via the PR preview. Each button tries one trick;
     the readout at the top shows live viewport numbers so you can see whether
     the bars actually went away. Not linked from anywhere; delete when the
     winning trick lands in the app. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scroll tricks — browser-bar test bench</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      /* Trick 0 (CSS): 1px of scroll room past the large viewport, so the
         document is always scrollable and the bars *can* auto-hide. */
      body { min-height: calc(100lvh + 1px); font-family: system-ui, sans-serif; }
      /* The "app": pinned to the visual viewport, grows when bars hide. */
      #app {
        position: fixed; top: 0; left: 0; right: 0; height: 100dvh;
        display: flex; flex-direction: column; background: #f5f3ff;
      }
      #readout {
        flex: 0 0 auto; padding: 10px 14px; background: #281c60; color: #fff;
        font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.6;
        white-space: pre; padding-top: calc(10px + env(safe-area-inset-top));
      }
      #tricks { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      button {
        padding: 13px 14px; font-size: 15px; text-align: left; cursor: pointer;
        border: 1px solid #c7c2e0; border-radius: 10px; background: #fff; color: #281c60;
      }
      button:active { background: #e8e4fa; }
      #log { font-family: ui-monospace, monospace; font-size: 12px; color: #555; white-space: pre-wrap; }
      #foot {
        flex: 0 0 auto; padding: 10px 14px; background: #281c60; color: #fff;
        font-size: 13px; text-align: center;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }
    </style>
  <script type="module" crossorigin src="/pr-preview/pr-190/demos/scroll-demo/demo-ty9jzg0f.js"></script></head>
  <body>
    <div id="app">
      <div id="readout">…</div>
      <div id="tricks">
        <button data-trick="nudge1">1 — scrollTo(0, 1) now</button>
        <button data-trick="nudge1-delay">2 — scrollTo(0, 1) after 300ms</button>
        <button data-trick="down-up">3 — scrollTo(0, 120) then back to 1</button>
        <button data-trick="smooth">4 — smooth scrollTo(0, 1)</button>
        <button data-trick="slack">5 — grow scroll room to 200lvh (then swipe up yourself)</button>
        <button data-trick="auto">6 — auto: nudge on every touchend (the app's trick)</button>
        <button data-trick="fullscreen">7 — requestFullscreen (Android; iPhone Safari refuses)</button>
        <div id="log"></div>
      </div>
      <div id="foot">bottom dock — visible = bottom bar not covering us</div>
    </div>
    <script>
      const readout = document.getElementById('readout');
      const log = document.getElementById('log');
      const say = (m) => { log.textContent = new Date().toISOString().slice(11, 19) + ' ' + m + '\n' + log.textContent; };

      // Live viewport numbers. innerHeight grows when the bars slide away;
      // lvh/svh (measured once via probe divs) bracket the possible range.
      const probe = (h) => {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;height:100' + h + ';width:0;visibility:hidden';
        document.body.appendChild(d);
        const v = d.getBoundingClientRect().height;
        d.remove();
        return Math.round(v);
      };
      function update() {
        const lvh = probe('lvh'), svh = probe('svh');
        const ih = window.innerHeight, vv = Math.round(window.visualViewport?.height ?? 0);
        const barsGone = ih >= lvh - 1;
        readout.textContent =
          'innerHeight   ' + ih + (barsGone ? '  ← bars HIDDEN' : '  ← bars visible') + '\n' +
          'visualViewport ' + vv + '\n' +
          'svh/lvh       ' + svh + ' / ' + lvh + '\n' +
          'scrollY       ' + Math.round(window.scrollY) + '   doc slack ' +
          (document.documentElement.scrollHeight - ih) + 'px';
      }
      ['resize', 'scroll', 'orientationchange'].forEach((e) => window.addEventListener(e, update, { passive: true }));
      window.visualViewport?.addEventListener('resize', update);
      setInterval(update, 500);
      update();

      let autoOn = false;
      const tricks = {
        'nudge1':       () => { window.scrollTo(0, 1); say('scrollTo(0,1)'); },
        'nudge1-delay': () => setTimeout(() => { window.scrollTo(0, 1); say('scrollTo(0,1) after 300ms'); }, 300),
        'down-up':      () => { window.scrollTo(0, 120); setTimeout(() => window.scrollTo(0, 1), 60); say('scrollTo(0,120) → (0,1)'); },
        'smooth':       () => { window.scrollTo({ top: 1, behavior: 'smooth' }); say('smooth scrollTo(0,1)'); },
        'slack':        () => { document.body.style.minHeight = '200lvh'; say('scroll room now 200lvh — swipe up'); },
        'auto':         () => { autoOn = !autoOn; say('auto nudge on touchend: ' + (autoOn ? 'ON' : 'off')); },
        'fullscreen':   () => {
          if (document.fullscreenElement) { document.exitFullscreen(); say('exit fullscreen'); }
          else document.documentElement.requestFullscreen?.().then(
            () => say('fullscreen OK'), (e) => say('fullscreen refused: ' + e.message));
        },
      };
      document.getElementById('tricks').addEventListener('click', (e) => {
        const t = e.target.closest('button')?.dataset.trick;
        if (t) tricks[t]();
      });
      window.addEventListener('touchend', () => {
        if (autoOn) setTimeout(() => { window.scrollTo(0, 1); update(); }, 100);
      }, { passive: true });

      // On load, try the app's current trick once, so just opening the page
      // shows whether it does anything on this browser.
      window.addEventListener('load', () => setTimeout(() => { window.scrollTo(0, 1); say('on-load scrollTo(0,1)'); }, 100));
    </script>
  </body>
</html>
