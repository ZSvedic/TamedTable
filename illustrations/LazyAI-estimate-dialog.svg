<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- TamedTable feature illustration: Lazy AI — the run-on-all estimate dialog -->
  <rect x="2" y="2" width="356" height="226" rx="16" fill="#FFFFFF" stroke="#DCDCDC"/>
  <!-- dimmed table behind the dialog -->
  <g opacity="0.3">
    <path d="M18 26 q0 -6 6 -6 h312 q6 0 6 6 v20 h-324 Z" fill="#281C60"/>
    <g font-size="12" fill="#281C60">
      <rect x="18" y="46" width="324" height="24" fill="#FFFFFF"/>
      <rect x="18" y="70" width="324" height="24" fill="#F6F2EB"/>
      <rect x="18" y="94" width="324" height="24" fill="#FFFFFF"/>
    </g>
    <rect x="18" y="20" width="324" height="98" rx="6" fill="none" stroke="#DCDCDC"/>
  </g>
  <!-- the estimate dialog -->
  <g>
    <rect x="44" y="62" width="272" height="146" rx="12" fill="#FFFFFF" stroke="#281C60"/>
    <text x="62" y="88" font-size="13" font-weight="700" fill="#281C60">Run on all rows?</text>
    <g font-size="12">
      <text x="62" y="112" fill="#6A6280">Rows remaining</text>
      <text x="228" y="112" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">24,980</text>
      <text x="62" y="132" fill="#6A6280">Estimated tokens</text>
      <text x="228" y="132" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">1.9 M</text>
      <text x="62" y="152" fill="#6A6280">Estimated cost</text>
      <text x="228" y="152" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" fill="#281C60">$0.42</text>
      <text x="62" y="172" fill="#6A6280">Estimated time</text>
      <text x="228" y="172" font-family="JetBrains Mono, ui-monospace, monospace" fill="#281C60">~4 min</text>
    </g>
    <line x1="62" y1="180" x2="298" y2="180" stroke="#DCDCDC"/>
    <rect x="62" y="186" width="70" height="16" rx="8" fill="#FFFFFF" stroke="#B8B0C8"/>
    <text x="79" y="197.5" font-size="10" font-weight="600" fill="#6A6280">Not yet</text>
    <rect x="224" y="186" width="74" height="16" rx="8" fill="#281C60"/>
    <text x="236" y="197.5" font-size="10" font-weight="600" fill="#FFFFFF">Run all</text>
  </g>
</svg>
