<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- TamedTable feature illustration: Flag wrong prices — "flag prices that seem wrong" -->
  <rect x="2" y="2" width="356" height="226" rx="16" fill="#FFFFFF" stroke="#DCDCDC"/>
  <rect x="18" y="18" width="324" height="36" rx="18" fill="#EFEBF7" stroke="#D8D0EC"/>
  <circle cx="40" cy="36" r="7" fill="#96BED7"/>
  <path d="M37.5 32.5 L43.5 36 L37.5 39.5 Z" fill="#281C60"/>
  <text x="56" y="41" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#281C60">flag prices that seem wrong</text>
  <g>
    <path d="M18 78 q0 -6 6 -6 h312 q6 0 6 6 v24 h-324 Z" fill="#281C60"/>
    <text x="32" y="91" font-size="11.5" font-weight="600" fill="#FFFFFF">Item</text>
    <text x="105" y="91" font-size="11.5" font-weight="600" fill="#FFFFFF">Price</text>
    <text x="152" y="91" font-size="10.5" font-weight="600" fill="#96BED7" textLength="44" lengthAdjust="spacingAndGlyphs">Price_ok</text>
    <text x="200" y="91" font-size="10.5" font-weight="600" fill="#96BED7">Price_ok_note</text>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">
      <rect x="18" y="102" width="324" height="24" fill="#FFFFFF"/>
      <text x="32" y="118" fill="#281C60">Notebook</text>
      <text x="105" y="118" fill="#281C60">19.99</text>
      <text x="152" y="118" fill="#281C60">true</text>
      <!-- bad row: the missing zero -->
      <rect x="18" y="126" width="324" height="24" fill="#FBEEF0"/>
      <text x="32" y="142" fill="#C0556B">Desk lamp</text>
      <text x="105" y="142" font-weight="600" fill="#C0556B">4.20</text>
      <text x="152" y="142" font-weight="600" fill="#C0556B">false</text>
      <text x="200" y="142" font-size="9.5" fill="#C0556B" textLength="98" lengthAdjust="spacingAndGlyphs">Price seems wrong</text>
      <rect x="18" y="150" width="324" height="24" fill="#FFFFFF"/>
      <text x="32" y="166" fill="#281C60">Keyboard</text>
      <text x="105" y="166" fill="#281C60">42.00</text>
      <text x="152" y="166" fill="#281C60">true</text>
      <!-- bad row -->
      <rect x="18" y="174" width="324" height="24" fill="#FBEEF0"/>
      <text x="32" y="190" fill="#C0556B">Monitor</text>
      <text x="105" y="190" font-weight="600" fill="#C0556B">3.10</text>
      <text x="152" y="190" font-weight="600" fill="#C0556B">false</text>
      <text x="200" y="190" font-size="9.5" fill="#C0556B" textLength="98" lengthAdjust="spacingAndGlyphs">Price seems wrong</text>
    </g>
    <rect x="18" y="72" width="324" height="126" rx="6" fill="none" stroke="#DCDCDC"/>
  </g>
</svg>
