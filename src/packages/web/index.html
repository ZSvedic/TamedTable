<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TamedTable</title>
    <meta name="theme-color" content="#281C60" />
    <link rel="icon" type="image/svg+xml" href="/icon-square-crisp.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="48x48" href="/favicon-48.png" />
    <!-- Brand fonts: Outfit for the wordmark, Inter for UI, JetBrains Mono
         for data. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- The reused engine and its CSV libraries are authored for Node and
         expect two globals the browser lacks. Both are installed here, before
         main.tsx runs. `process` is a small stub — the engine only reads a few
         env vars at init. `Buffer` must be the real implementation, because
         csv-parse builds buffers the moment it loads; it comes from the
         `buffer` polyfill package. -->
    <script>
      window.process = { env: {}, cwd: function () { return '/'; }, platform: 'browser' };
    </script>
    <script type="module">
      import { Buffer } from 'buffer';
      window.Buffer = Buffer;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
