<!doctype html>
<!-- #GherkinTour demo — manual, isolated test of parseTours.
     Run: bun packages/gherkin-tour/demo.html -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>gherkin-tour demo</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 70rem; }
    h1 { font-size: 1.2rem; }
    .cols { display: flex; gap: 1rem; align-items: stretch; }
    textarea { flex: 1; min-height: 24rem; font-family: monospace; padding: .5rem; }
    pre { flex: 1; margin: 0; padding: .5rem; background: #f4f4f4; overflow: auto; }
  </style>
</head>
<body>
  <h1>gherkin-tour — parseTours</h1>
  <p>Edit the feature on the left; the parsed tour scenarios update on the right.</p>
  <div class="cols">
    <textarea id="src" spellcheck="false"></textarea>
    <pre id="out"></pre>
  </div>

  <script type="module">
    import { parseTours } from './index.ts';

    const sample = `Feature: Demo

  Background:
    Given load "people.csv"

  @tutorial
  Scenario: Filter adults
    When query "keep rows where age >= 18"
    Then the expected output is "adults.csv"
    And compare with the expected output
`;

    const src = document.getElementById('src');
    const out = document.getElementById('out');
    src.value = sample;

    function render() {
      try {
        out.textContent = JSON.stringify(parseTours(src.value), null, 2);
      } catch (e) {
        out.textContent = String(e);
      }
    }
    src.addEventListener('input', render);
    render();
  </script>
</body>
</html>
