<!doctype html>
<!-- #ModelConfig demo — manual, isolated test of the catalogue + resolveConfig.
     Run: bun packages/model-config/demo.html
     (env.ts is Node-only and intentionally not used here.) -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>model-config demo</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
    h1 { font-size: 1.2rem; }
    h2 { font-size: 1rem; margin-top: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .25rem .5rem; text-align: left; }
    label { display: block; margin: .25rem 0; }
    input { width: 18rem; }
    pre { padding: .5rem; background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>model-config — catalogue &amp; resolveConfig</h1>

  <h2>ALL_MODELS</h2>
  <table id="models"><thead><tr>
    <th>id</th><th>name</th><th>provider</th><th>voice</th>
  </tr></thead><tbody></tbody></table>

  <h2>resolveConfig(env, stored)</h2>
  <p>Type into the env / stored fields; the resolved config updates live.</p>
  <label>GEMINI_API_KEY    <input id="GEMINI_API_KEY" /></label>
  <label>OPENAI_API_KEY    <input id="OPENAI_API_KEY" /></label>
  <label>ANTHROPIC_API_KEY <input id="ANTHROPIC_API_KEY" /></label>
  <label>TAMEDTABLE_MODEL  <input id="TAMEDTABLE_MODEL" /></label>
  <label>stored.provider   <input id="storedProvider" placeholder="anthropic|gemini|openai" /></label>
  <label>stored.model      <input id="storedModel" /></label>
  <pre id="out"></pre>

  <script type="module">
    import { ALL_MODELS, resolveConfig } from './index.ts';

    const tbody = document.querySelector('#models tbody');
    tbody.innerHTML = ALL_MODELS.map((m) =>
      `<tr><td>${m.id}</td><td>${m.name}</td><td>${m.provider}</td><td>${m.voiceInput ? '✓' : ''}</td></tr>`,
    ).join('');

    const fields = ['GEMINI_API_KEY', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'TAMEDTABLE_MODEL'];
    const out = document.getElementById('out');
    const val = (id) => document.getElementById(id).value.trim() || undefined;

    function render() {
      const env = {};
      for (const f of fields) env[f] = val(f);
      const stored = {};
      if (val('storedProvider')) stored.provider = val('storedProvider');
      if (val('storedModel'))    stored.model = val('storedModel');
      out.textContent = JSON.stringify(resolveConfig(env, stored), null, 2);
    }
    for (const el of document.querySelectorAll('input')) el.addEventListener('input', render);
    render();
  </script>
</body>
</html>
