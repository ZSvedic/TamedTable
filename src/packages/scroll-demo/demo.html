<!doctype html>
<!-- #MobileShell — throwaway test bench for hiding the phone browser's bars.
     Round 2: no scrollTo tricks (iOS ignores them all; only trick 5 — real
     scroll room — worked). Instead the page models the proposed app layout:
     the DOCUMENT scrolls through a tall table, so a natural swipe hides the
     bars and the browser's own scrollbar shows the true position in the
     table. App bar + dock are fixed; the header row is sticky below the app
     bar. Not linked from anywhere; delete when the layout lands in the app. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Document-scroll table — browser-bar test bench</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { font-family: system-ui, sans-serif; background: #f5f3ff; }

      /* App bar: pinned to the top of the visual viewport. The table flows
         underneath it (body padding clears it). */
      #appbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        background: #281c60; color: #fff;
        padding: 8px 14px calc(8px);
        padding-top: calc(8px + env(safe-area-inset-top));
      }
      #appbar b { font-size: 14px; }
      #readout {
        font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
        white-space: pre; opacity: 0.9;
      }

      /* Dock: pinned to the bottom of the visual viewport — rises when the
         bottom bar hides. */
      #dock {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
        background: #281c60; color: #fff; font-size: 13px; text-align: center;
        padding: 10px 14px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }

      /* The table is normal document flow — the PAGE scrolls it, not an inner
         div. Body padding keeps the first/last rows clear of the bars. */
      body { padding-top: var(--appbar-h, 92px); padding-bottom: 64px; }
      table { border-collapse: collapse; width: 100%; background: #fff; }
      th, td {
        padding: 8px 10px; border-bottom: 1px solid #e2ddf5; font-size: 13px;
        text-align: left; white-space: nowrap;
      }
      td:first-child, th:first-child { color: #8a84b0; font-family: ui-monospace, monospace; }
      /* Header row sticks just below the fixed app bar while the page scrolls. */
      thead th {
        position: sticky; top: var(--appbar-h, 92px); z-index: 5;
        background: #e8e4fa; color: #281c60; border-bottom: 1px solid #c7c2e0;
      }
      #controls { padding: 10px 14px; display: flex; gap: 8px; }
      #controls button {
        padding: 8px 12px; font-size: 13px; cursor: pointer;
        border: 1px solid #c7c2e0; border-radius: 8px; background: #fff; color: #281c60;
      }
    </style>
  </head>
  <body>
    <div id="appbar">
      <b>customers.csv · document-scroll layout</b>
      <div id="readout">…</div>
    </div>

    <div id="controls">
      <button data-rows="300">300 rows (taller than screen)</button>
      <button data-rows="8">8 rows (shorter — no scroll, bars stay)</button>
    </div>

    <table>
      <thead>
        <tr><th>#</th><th>FirstName</th><th>LastName</th><th>Country</th><th>Score</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div id="dock">Menu · Undo · History · Type · Speak</div>

    <script>
      // Fake data — enough rows that the document is much taller than the
      // viewport, so swiping through the table scrolls the PAGE (hiding the
      // bars) and the browser scrollbar tracks the position in the table.
      const FIRST = ['Ana', 'Marko', 'Ivana', 'Luka', 'Petra', 'Josip', 'Maja', 'Karlo'];
      const LAST = ['Horvat', 'Kovač', 'Babić', 'Novak', 'Jurić', 'Marić'];
      const CTRY = ['Croatia', 'Germany', 'Italy', 'Austria', 'Slovenia'];
      function fill(n) {
        const rows = [];
        for (let i = 1; i <= n; i++) {
          rows.push('<tr><td>' + i + '</td><td>' + FIRST[i % FIRST.length] + '</td><td>' +
            LAST[i % LAST.length] + '</td><td>' + CTRY[i % CTRY.length] + '</td><td>' +
            ((i * 37) % 100) + '</td></tr>');
        }
        document.getElementById('rows').innerHTML = rows.join('');
        update();
      }
      document.getElementById('controls').addEventListener('click', (e) => {
        const n = e.target.closest('button')?.dataset.rows;
        if (n) { fill(+n); window.scrollTo(0, 0); }
      });

      // Body padding must clear the app bar exactly, and the sticky header
      // sits at the same offset. Measured live (the readout changes height).
      const appbar = document.getElementById('appbar');
      function sizeBar() {
        document.documentElement.style.setProperty('--appbar-h', appbar.offsetHeight + 'px');
      }

      // Live viewport readout: innerHeight vs 100lvh says whether the bars are
      // hidden; scrollY/scrollHeight is the position the scrollbar shows.
      const readout = document.getElementById('readout');
      const probe = (h) => {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;height:100' + h + ';width:0;visibility:hidden';
        document.body.appendChild(d);
        const v = d.getBoundingClientRect().height;
        d.remove();
        return Math.round(v);
      };
      function update() {
        const lvh = probe('lvh'), svh = probe('svh'), ih = window.innerHeight;
        const max = document.documentElement.scrollHeight - ih;
        const pct = max > 0 ? Math.round((window.scrollY / max) * 100) : 0;
        readout.textContent =
          'innerHeight ' + ih + ' (svh ' + svh + ' / lvh ' + lvh + ')' +
          (ih >= lvh - 1 ? '  bars HIDDEN' : '  bars visible') + '\n' +
          'page scroll ' + Math.round(window.scrollY) + 'px = ' + pct + '% of table';
        sizeBar();
      }
      ['resize', 'scroll', 'orientationchange'].forEach((e) =>
        window.addEventListener(e, update, { passive: true }));
      window.visualViewport?.addEventListener('resize', update);

      fill(300);
      update();
    </script>
  </body>
</html>
